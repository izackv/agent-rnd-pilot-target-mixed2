# Required checks. Job names here are the check names the Git-policy template requires;
# they are language-neutral on purpose (D-11) so a Node.js target can reuse the policy.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest tests/unit -q
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest tests/integration -q
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest tests/e2e -q
      - name: full suite in one invocation (collection across all test dirs)
        run: uv run pytest -q
  docs:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'   # the waiver line lives in the PR body; post-merge pushes have no PR body
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: documentation impact
        env:
          DOCS_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOCS_CHECK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DOCS_CHECK_PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/docs_check.py
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # gitleaks diffs commit ranges; a shallow clone has no parent
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: dependency audit
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/req.txt && uvx pip-audit -r /tmp/req.txt --strict
      - name: secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
