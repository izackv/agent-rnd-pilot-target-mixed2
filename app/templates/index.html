<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main>
    <h1>{{ title }}</h1>
    <p class="hint">Role: <select id="role" aria-label="role"><option value="viewer">viewer</option><option value="admin">admin</option></select></p>
    <p><button type="button" id="export">Export CSV</button></p>
    <table id="reports" aria-live="polite">
      <thead><tr><th>ID</th><th>Title</th><th>Owner</th><th>Rows</th></tr></thead>
      <tbody></tbody>
    </table>
    <p id="status" role="status"></p>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
